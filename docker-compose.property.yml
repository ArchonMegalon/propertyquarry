    networks:
      - default
      - propertyquarry_render_internal
    volumes:
      - propertyquarry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propertyquarry"]
      interval: 30s
      timeout: 5s
      retries: 3

  propertyquarry-backup:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: "${PROPERTYQUARRY_BACKUP_CONTAINER_NAME:-propertyquarry-backup-live}"
    cgroup_parent: "${PROPERTYQUARRY_RUNTIME_CGROUP_PARENT:-system.slice}"
    restart: "${PROPERTYQUARRY_BACKUP_RESTART_POLICY:-unless-stopped}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for property compose}"
      PROPERTYQUARRY_BACKUP_DB_HOST: propertyquarry-db
      PROPERTYQUARRY_BACKUP_DB_PORT: "5432"
      PROPERTYQUARRY_BACKUP_DB_NAME: propertyquarry
      PROPERTYQUARRY_BACKUP_DB_USER: postgres
      PROPERTYQUARRY_BACKUP_DIR: /backups
      PROPERTYQUARRY_BACKUP_INTERVAL_SECONDS: "${PROPERTYQUARRY_BACKUP_INTERVAL_SECONDS:-86400}"
      PROPERTYQUARRY_BACKUP_RETRY_SECONDS: "${PROPERTYQUARRY_BACKUP_RETRY_SECONDS:-300}"
      PROPERTYQUARRY_BACKUP_RETENTION_DAYS: "${PROPERTYQUARRY_BACKUP_RETENTION_DAYS:-7}"
      PROPERTYQUARRY_BACKUP_MAX_FILES: "${PROPERTYQUARRY_BACKUP_MAX_FILES:-8}"
      PROPERTYQUARRY_BACKUP_MIN_FREE_BYTES: "${PROPERTYQUARRY_BACKUP_MIN_FREE_BYTES:-5368709120}"
      PROPERTYQUARRY_BACKUP_HEALTH_MAX_AGE_SECONDS: "${PROPERTYQUARRY_BACKUP_HEALTH_MAX_AGE_SECONDS:-129600}"
      PROPERTYQUARRY_PUBLIC_CACHE_EVENT_RETENTION_DAYS: "${PROPERTYQUARRY_PUBLIC_CACHE_EVENT_RETENTION_DAYS:-7}"
      PROPERTYQUARRY_DATABASE_MAINTENANCE_BATCH_SIZE: "${PROPERTYQUARRY_DATABASE_MAINTENANCE_BATCH_SIZE:-5000}"
      PROPERTYQUARRY_DATABASE_MAINTENANCE_MAX_BATCHES: "${PROPERTYQUARRY_DATABASE_MAINTENANCE_MAX_BATCHES:-32}"
      TZ: Europe/Vienna
    command: ["/bin/sh", "/opt/propertyquarry_postgres_backup.sh", "daemon"]
    volumes:
      - ./scripts/propertyquarry_postgres_backup.sh:/opt/propertyquarry_postgres_backup.sh:ro
      - propertyquarry_backups:/backups
    tmpfs:
      - /tmp:size=${PROPERTYQUARRY_BACKUP_TMPFS_LIMIT:-64m},mode=1777
    cpu_shares: ${PROPERTYQUARRY_BACKUP_CPU_SHARES:-128}
    cpus: ${PROPERTYQUARRY_BACKUP_CPUS:-0.5}
    mem_limit: "${PROPERTYQUARRY_BACKUP_MEMORY_LIMIT:-512m}"
    mem_reservation: "${PROPERTYQUARRY_BACKUP_MEMORY_RESERVATION:-64m}"
    memswap_limit: "${PROPERTYQUARRY_BACKUP_MEMORY_LIMIT:-512m}"
    pids_limit: ${PROPERTYQUARRY_BACKUP_PIDS_LIMIT:-64}
    oom_score_adj: 700
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/propertyquarry_postgres_backup.sh", "health"]
      interval: 5m
      timeout: 60s
      start_period: 15m
      retries: 3
    depends_on:
      propertyquarry-db:
        condition: service_healthy

volumes:
  propertyquarry_artifacts: {}
  propertyquarry_governed_render_consents: {}
  propertyquarry_governed_public_tours:
    name: property_propertyquarry_governed_public_tours
  propertyquarry_pgdata: {}
  propertyquarry_backups: {}
  propertyquarry_public_tours: {}
  propertyquarry_provider_ledger: {}

networks:
  propertyquarry_render_internal:
    internal: true
