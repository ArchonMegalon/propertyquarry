apply plugin: 'com.android.application'

def propertyQuarryKeystorePath = System.getenv('PROPERTYQUARRY_ANDROID_KEYSTORE_PATH') ?: ''
def propertyQuarryKeystorePassword = System.getenv('PROPERTYQUARRY_ANDROID_KEYSTORE_PASSWORD') ?: ''
def propertyQuarryKeyAlias = System.getenv('PROPERTYQUARRY_ANDROID_KEY_ALIAS') ?: ''
def propertyQuarryKeyPassword = System.getenv('PROPERTYQUARRY_ANDROID_KEY_PASSWORD') ?: ''
def propertyQuarryReleaseSigningConfigured = [
    propertyQuarryKeystorePath,
    propertyQuarryKeystorePassword,
    propertyQuarryKeyAlias,
    propertyQuarryKeyPassword,
].every { !it.isBlank() } && file(propertyQuarryKeystorePath).isFile()

android {
    namespace = "com.myexternalbrain.propertyquarry"
    compileSdk = rootProject.ext.compileSdkVersion
    testBuildType "preview"
    defaultConfig {
        applicationId "com.myexternalbrain.propertyquarry"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    signingConfigs {
        if (propertyQuarryReleaseSigningConfigured) {
            release {
                storeFile file(propertyQuarryKeystorePath)
                storePassword propertyQuarryKeystorePassword
                keyAlias propertyQuarryKeyAlias
                keyPassword propertyQuarryKeyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField "String", "PROPERTYQUARRY_ORIGIN", '"https://propertyquarry.com"'
            buildConfigField "String", "MOBILE_CONTRACT_VERSION", '"1"'
        }
        preview {
            initWith debug
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            matchingFallbacks = ['debug']
            buildConfigField "String", "PROPERTYQUARRY_ORIGIN", '"https://propertyquarry.com"'
            buildConfigField "String", "MOBILE_CONTRACT_VERSION", '"1"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField "String", "PROPERTYQUARRY_ORIGIN", '"https://propertyquarry.com"'
            buildConfigField "String", "MOBILE_CONTRACT_VERSION", '"1"'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (propertyQuarryReleaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

tasks.register('verifyPropertyQuarryReleaseSigning') {
    doLast {
        if (!propertyQuarryReleaseSigningConfigured) {
            throw new GradleException(
                'PropertyQuarry release signing is not configured. Set the four PROPERTYQUARRY_ANDROID_KEY* environment values.'
            )
        }
    }
}

tasks.matching { it.name in ['assembleRelease', 'bundleRelease'] }.configureEach {
    dependsOn tasks.named('verifyPropertyQuarryReleaseSigning')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.browser:browser:1.9.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
